<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demolición 3D</title>
<style>
:root{--bg:rgba(255,255,255,.78);--fg:#14202b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:rgba(15,20,28,.78);--fg:#eef3f8}}
:root[data-theme="dark"]{--bg:rgba(15,20,28,.78);--fg:#eef3f8}
html,body{margin:0;height:100%;overflow:hidden;background:#87b5e0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--bg);color:var(--fg);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;max-width:260px}
#hud b{font-size:18px}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fff;border-radius:50%;mix-blend-mode:difference;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div id="cross"></div>
<div id="hud"><b id="score">0 / 0</b> cajas derribadas<br>
WASD mover · ratón mirar (clic para capturar)<br>Clic / Espacio: disparar · R: reiniciar<br>Flechas: mirar si no hay ratón</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b5e0);scene.fog=new THREE.Fog(0x87b5e0,30,110);
const camera=new THREE.PerspectiveCamera(70,1,.1,200);camera.rotation.order='YXZ';

// Luces
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x4a5a30,.7));
const sun=new THREE.DirectionalLight(0xfff1d6,1.4);
sun.position.set(25,40,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:1,far:120});
sun.shadow.bias=-.0005;scene.add(sun);

// Texturas procedurales
function tex(size,fn,rx,ry,srgb){
  const c=document.createElement('canvas');c.width=c.height=size;fn(c.getContext('2d'),size);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;
  if(srgb)t.encoding=THREE.sRGBEncoding;return t;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const woodTex=tex(512,(g,s)=>{
  g.fillStyle='#9a6a35';g.fillRect(0,0,s,s);
  for(let i=0;i<260;i++){
    g.strokeStyle=`rgba(${rnd(50,90)|0},${rnd(25,50)|0},10,${rnd(.1,.4)})`;g.lineWidth=rnd(.6,2.5);
    g.beginPath();const y=rnd(0,s),a=rnd(2,8),f=rnd(.005,.02);
    for(let x=0;x<=s;x+=8)g.lineTo(x,y+Math.sin(x*f+i)*a);g.stroke();
  }
  g.strokeStyle='#4a2c12';g.lineWidth=28;g.strokeRect(0,0,s,s);
  g.lineWidth=18;g.beginPath();g.moveTo(14,14);g.lineTo(s-14,s-14);g.moveTo(s-14,14);g.lineTo(14,s-14);g.stroke();
},1,1,true);
const grassTex=tex(512,(g,s)=>{
  g.fillStyle='#3f6b2a';g.fillRect(0,0,s,s);
  for(let i=0;i<14000;i++){g.fillStyle=`rgb(${rnd(40,90)|0},${rnd(95,150)|0},${rnd(30,60)|0})`;g.fillRect(rnd(0,s),rnd(0,s),rnd(1,3),rnd(2,6));}
},60,60,true);
const ballTex=tex(256,(g,s)=>{
  g.fillStyle='#d8392b';g.fillRect(0,0,s,s);g.fillStyle='#f2f2f2';
  for(let i=0;i<8;i+=2)g.fillRect(i*s/8,0,s/8,s);
},1,1,true);

// Física
const world=new CANNON.World();world.gravity.set(0,-9.82,0);
world.broadphase=new CANNON.SAPBroadphase(world);world.allowSleep=true;world.solver.iterations=14;
const mCrate=new CANNON.Material('crate'),mBall=new CANNON.Material('ball'),mGround=new CANNON.Material('ground');
world.addContactMaterial(new CANNON.ContactMaterial(mCrate,mGround,{friction:.6,restitution:.05}));
world.addContactMaterial(new CANNON.ContactMaterial(mCrate,mCrate,{friction:.5,restitution:.05}));
world.addContactMaterial(new CANNON.ContactMaterial(mBall,mCrate,{friction:.3,restitution:.35}));
world.addContactMaterial(new CANNON.ContactMaterial(mBall,mGround,{friction:.4,restitution:.5}));
const gBody=new CANNON.Body({mass:0,material:mGround,shape:new CANNON.Plane()});
gBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);world.addBody(gBody);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshStandardMaterial({map:grassTex,roughness:1,bumpMap:grassTex,bumpScale:.6}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Cajas y bolas
const boxGeo=new THREE.BoxGeometry(1,1,1);
const boxMat=new THREE.MeshStandardMaterial({map:woodTex,bumpMap:woodTex,bumpScale:.8,roughness:.85});
const ballGeo=new THREE.SphereGeometry(.3,32,24);
const ballMat=new THREE.MeshStandardMaterial({map:ballTex,roughness:.35,metalness:.25});
let crates=[],balls=[];

function addCrate(x,y,z){
  const mesh=new THREE.Mesh(boxGeo,boxMat);mesh.castShadow=mesh.receiveShadow=true;scene.add(mesh);
  const body=new CANNON.Body({mass:1,material:mCrate,shape:new CANNON.Box(new CANNON.Vec3(.5,.5,.5)),
    sleepSpeedLimit:.2,sleepTimeLimit:.6,linearDamping:.05,angularDamping:.1});
  body.position.set(x,y,z);world.addBody(body);
  crates.push({mesh,body,start:new CANNON.Vec3(x,y,z)});
}
function wall(x,z,w,h){
  for(let r=0;r<h;r++)for(let c=0;c<w;c++)addCrate(x+(c-w/2)*1.02+(r%2?.5:0),.5+r*1.001,z);
}
function pyramid(x,z,n){
  for(let r=0;r<n;r++)for(let c=0;c<n-r;c++)addCrate(x+(c-(n-r)/2)*1.02,.5+r*1.001,z);
}
function build(){
  crates.forEach(o=>{scene.remove(o.mesh);world.removeBody(o.body)});crates=[];
  balls.forEach(o=>{scene.remove(o.mesh);world.removeBody(o.body)});balls=[];
  wall(0,-14,7,6);pyramid(-11,-8,6);pyramid(11,-8,6);wall(0,-24,9,4);
  document.getElementById('score').textContent='0 / '+crates.length;
}
build();

function shoot(){
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  const p=camera.position.clone().addScaledVector(dir,1);
  const mesh=new THREE.Mesh(ballGeo,ballMat);mesh.castShadow=true;scene.add(mesh);
  const body=new CANNON.Body({mass:4,material:mBall,shape:new CANNON.Sphere(.3),linearDamping:.01});
  body.position.set(p.x,p.y,p.z);body.velocity.set(dir.x*30,dir.y*30,dir.z*30);world.addBody(body);
  balls.push({mesh,body});
  if(balls.length>25){const o=balls.shift();scene.remove(o.mesh);world.removeBody(o.body);}
}

// Controles
let yaw=0,pitch=-.05;const pos=new THREE.Vector3(0,1.7,12);const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){shoot();e.preventDefault();}if(e.code==='KeyR')build();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{
  if(document.pointerLockElement===canvas||e.buttons===2){yaw-=e.movementX*.0025;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.0025));}
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(document.pointerLockElement!==canvas){try{canvas.requestPointerLock();}catch(_){}}
  shoot();
});
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// Bucle
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  if(keys.ArrowLeft)yaw+=dt*1.8;if(keys.ArrowRight)yaw-=dt*1.8;
  if(keys.ArrowUp)pitch=Math.min(1.4,pitch+dt*1.5);if(keys.ArrowDown)pitch=Math.max(-1.4,pitch-dt*1.5);
  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),v=(keys.ShiftLeft?10:6)*dt;
  pos.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*v;pos.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*v;
  pos.x=Math.max(-45,Math.min(45,pos.x));pos.z=Math.max(-45,Math.min(45,pos.z));
  camera.position.copy(pos);camera.rotation.set(pitch,yaw,0);

  world.step(1/60,dt,4);
  let down=0;
  for(const o of crates){
    o.mesh.position.copy(o.body.position);o.mesh.quaternion.copy(o.body.quaternion);
    if(o.body.position.distanceTo(o.start)>1.3)down++;
  }
  for(const o of balls){o.mesh.position.copy(o.body.position);o.mesh.quaternion.copy(o.body.quaternion);}
  document.getElementById('score').textContent=down+' / '+crates.length;
  renderer.render(scene,camera);
}
loop();
</script></body></html>
