<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Arcade Hub · Mis juegos</title>
<style>
:root{--bg:#0b1020;--bg2:#121a33;--fg:#f4f7fb;--mut:#9aa7c7;--ac:#ff3b5c;--go:#ffc53a;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(1200px 600px at 15% -10%,#2a1250 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#10304f 0,transparent 55%),var(--bg);background-attachment:fixed}
body.playing{overflow:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:30px;font-weight:900;letter-spacing:3px;font-style:italic;background:linear-gradient(90deg,var(--ac),var(--go));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.logo small{display:block;font-size:12px;font-style:normal;letter-spacing:1px;color:var(--mut);-webkit-text-fill-color:var(--mut);font-weight:500}
#q{background:var(--card);border:1px solid var(--bd);border-radius:12px;color:var(--fg);padding:10px 14px;font-size:15px;min-width:220px;outline:none}
#q:focus{border-color:var(--go)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--card);border:1px solid var(--bd);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--go)}
.chip.on{background:linear-gradient(135deg,var(--ac),#ff7a3a);border-color:transparent;font-weight:700}
#cont{display:none;align-items:center;gap:14px;padding:14px 16px;margin-bottom:18px;border-radius:16px;background:linear-gradient(135deg,rgba(255,59,92,.18),rgba(255,197,58,.12));border:1px solid var(--bd)}
#cont .em{font-size:34px}
#cont b{display:block}#cont span{color:var(--mut);font-size:13px}
#cont button{margin-left:auto}
.btn{background:linear-gradient(135deg,var(--ac),#ff7a3a);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.5px;box-shadow:0 6px 20px rgba(255,59,92,.35);transition:transform .15s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s;animation:cin .45s backwards}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:var(--go);box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 24px rgba(255,197,58,.18);outline:none}
@keyframes cin{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.th{height:140px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.th::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px)}
.th .em{font-size:64px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));transition:transform .3s;position:relative;z-index:1}
.th img{height:104px;width:104px;object-fit:contain;border-radius:22px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));position:relative;z-index:1;transition:transform .3s}
.card:hover .em,.card:hover .th img{transform:scale(1.15) rotate(-4deg)}
.badge{position:absolute;left:10px;top:10px;z-index:2;background:var(--go);color:#111;font-weight:800;font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:.5px}
.fav{position:absolute;right:8px;top:6px;z-index:2;background:rgba(0,0,0,.35);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;color:#fff;transition:.15s}
.fav.on{color:var(--go)}.fav:hover{transform:scale(1.15)}
.bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.bd h3{margin:0;font-size:20px}
.bd p{margin:0;color:var(--mut);font-size:14px;line-height:1.45}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags i{font-style:normal;font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.09)}
.ctl{font-size:12px;color:var(--mut);border-top:1px dashed var(--bd);padding-top:8px;margin-top:auto}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.meta span{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:50px 0;display:none}
footer{margin-top:34px;text-align:center;color:var(--mut);font-size:12px}
/* Reproductor */
#player{position:fixed;inset:0;z-index:50;background:#000;display:none}
#player.on{display:block;animation:fin .3s ease}
@keyframes fin{from{opacity:0}to{opacity:1}}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#2a1250,#070a16 70%);z-index:2;transition:opacity .35s}
#ld.off{opacity:0;pointer-events:none}
#ld .em{font-size:64px;animation:bob 1s infinite alternate}@keyframes bob{to{transform:translateY(-12px)}}
#ld .bar{width:min(260px,70vw);height:8px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
#ld .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--ac),var(--go));animation:ld 1.1s infinite ease-in-out}
@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
#tab{position:absolute;left:0;top:50%;transform:translate(calc(-100% + 18px),-50%);z-index:5;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;border-radius:0 14px 14px 0;background:rgba(10,14,26,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-left:0;transition:transform .25s,opacity .25s;opacity:.55}
#tab::after{content:"›";position:absolute;right:4px;font-size:16px;color:#fff;opacity:.8}
#tab.open,#tab:hover{transform:translate(0,-50%);opacity:1}
#tab.open::after,#tab:hover::after{display:none}
#tab button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:9px 12px;font-size:15px;cursor:pointer;white-space:nowrap}
#tab button:hover{background:rgba(255,59,92,.7)}
#tab:not(.open):not(:hover) button{pointer-events:none}
@media (max-width:520px){.th{height:120px}#q{min-width:0;flex:1}.logo{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo">ARCADE HUB<small>Elige un juego y a jugar</small></h1>
    <input id="q" type="search" placeholder="Buscar juego…  ( / )" autocomplete="off" aria-label="Buscar juego">
  </header>
  <div id="cont"><div class="em" id="ce"></div><div><b id="cn"></b><span>Tu última partida</span></div><button class="btn" id="cb">▶ Continuar</button></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No hay juegos que coincidan 🔎</div>
  <footer id="foot"></footer>
</div>

<div id="player" aria-label="Juego en pantalla completa">
  <div id="ld"><div class="em" id="le"></div><div id="ln" style="font-weight:800;letter-spacing:2px"></div><div class="bar"><i></i></div></div>
  <iframe id="frame" title="Juego" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div id="tab"><button id="bk" title="Volver a la lista">← Juegos</button><button id="rl" title="Reiniciar el juego">↻</button><button id="fs" title="Pantalla completa">⛶</button></div>
</div>

<script src="games.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const G=window.GAMES||[];
const KEY='arcadehub.v1';
let ST={fav:[],last:'',plays:{}};
try{Object.assign(ST,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let filter='Todos',query='',opened=false;

function chips(){
  const tags=['Todos','⭐ Favoritos',...new Set(G.flatMap(g=>g.tags||[]))];
  $('chips').innerHTML=tags.map(t=>`<button class="chip${t===filter?' on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
}
function match(g){
  if(filter==='⭐ Favoritos'&&!ST.fav.includes(g.id))return false;
  if(filter!=='Todos'&&filter!=='⭐ Favoritos'&&!(g.tags||[]).includes(filter))return false;
  const q=query.trim().toLowerCase();
  return !q||(g.name+' '+g.desc+' '+(g.tags||[]).join(' ')).toLowerCase().includes(q);
}
function grid(){
  const list=G.filter(match);
  $('grid').innerHTML=list.map((g,i)=>{
    const c=g.colors||['#ff3b5c','#ffc53a'],n=ST.plays[g.id]||0;
    return `<article class="card" tabindex="0" data-id="${esc(g.id)}" style="animation-delay:${i*50}ms">
      <div class="th" style="background:linear-gradient(135deg,${c[0]},${c[1]})">
        ${g.badge?`<span class="badge">${esc(g.badge)}</span>`:''}
        <button class="fav${ST.fav.includes(g.id)?' on':''}" data-fav="${esc(g.id)}" title="Favorito" aria-label="Favorito">${ST.fav.includes(g.id)?'★':'☆'}</button>
        ${g.img?`<img src="${esc(g.img)}" alt="" loading="lazy">`:`<span class="em">${esc(g.emoji||'🎮')}</span>`}
      </div>
      <div class="bd"><h3>${esc(g.name)}</h3><div class="tags">${(g.tags||[]).map(t=>`<i>${esc(t)}</i>`).join('')}</div>
        <p>${esc(g.desc||'')}</p><div class="ctl">🎮 ${esc(g.controls||'')}</div>
        <div class="meta"><span>${n?'Jugado '+n+(n===1?' vez':' veces'):'Sin jugar aún'}</span><button class="btn" data-play="${esc(g.id)}">▶ JUGAR</button></div></div>
    </article>`}).join('');
  $('empty').style.display=list.length?'none':'block';
  const l=G.find(g=>g.id===ST.last);
  $('cont').style.display=l?'flex':'none';
  if(l){$('ce').textContent=l.emoji||'🎮';$('cn').textContent=l.name;$('cb').onclick=()=>go(l.id)}
  $('foot').textContent=G.length+' juegos · tus favoritos y partidas se guardan en este navegador';
}
function go(id){opened=true;location.hash='#/'+id}
$('grid').addEventListener('click',e=>{
  const f=e.target.closest('[data-fav]');
  if(f){e.stopPropagation();const id=f.dataset.fav;ST.fav=ST.fav.includes(id)?ST.fav.filter(x=>x!==id):[...ST.fav,id];save();grid();return}
  const c=e.target.closest('.card');if(c)go(c.dataset.id)});
$('grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();go(e.target.dataset.id)}});
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){filter=b.dataset.t;chips();grid()}});
$('q').addEventListener('input',e=>{query=e.target.value;grid()});
addEventListener('keydown',e=>{if(e.key==='/'&&!$('player').classList.contains('on')&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}});

/* Reproductor */
const frame=$('frame'),player=$('player'),tab=$('tab');
let cur=null,tabT=0;
const load=u=>{try{frame.contentWindow.location.replace(new URL(u,location.href).href)}catch(e){frame.src=u}};
function openGame(g){
  cur=g;ST.last=g.id;ST.plays[g.id]=(ST.plays[g.id]||0)+1;save();
  $('le').textContent=g.emoji||'🎮';$('ln').textContent=g.name.toUpperCase();$('ld').classList.remove('off');
  document.title=g.name+' · Arcade Hub';document.body.classList.add('playing');player.classList.add('on');
  frame.onload=()=>{setTimeout(()=>$('ld').classList.add('off'),250);try{frame.contentWindow.focus()}catch(e){}};
  load(encodeURIComponent(g.id)+'.html');
  tab.classList.add('open');clearTimeout(tabT);tabT=setTimeout(()=>tab.classList.remove('open'),2800);
}
function closeGame(){
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  player.classList.remove('on');document.body.classList.remove('playing');
  frame.onload=null;load('about:blank');cur=null;document.title='Arcade Hub · Mis juegos';grid();
}
function route(){
  const m=location.hash.match(/^#\/(.+)$/),g=m&&G.find(x=>x.id===decodeURIComponent(m[1]));
  if(g){if(!cur||cur.id!==g.id)openGame(g)}else if(cur)closeGame();
}
addEventListener('hashchange',route);
$('bk').onclick=()=>{closeGame();try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}};
$('rl').onclick=()=>{if(cur){$('ld').classList.remove('off');load(encodeURIComponent(cur.id)+'.html')}};
if(document.fullscreenEnabled){$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():player.requestFullscreen().catch(()=>{});try{frame.contentWindow.focus()}catch(e){}}}else $('fs').style.display='none';
tab.addEventListener('click',e=>{if(e.target===tab){tab.classList.toggle('open')}});
tab.addEventListener('pointerenter',()=>clearTimeout(tabT));
tab.addEventListener('pointerleave',()=>{clearTimeout(tabT);tabT=setTimeout(()=>tab.classList.remove('open'),1200)});

chips();grid();route();
})();
</script>
</body>
</html>
